name: Build macOS Intel

on:
  push:
  pull_request:

jobs:
  build-macos-intel:
    runs-on: macos-12  # Intel runner

    steps:
    - name: Check architecture
      run: |
        uname -m
        sysctl -n machdep.cpu.brand_string
    
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install LLVM (clang 16)
      run: |
        brew update
        brew install llvm

    - name: Build
      run: |
        export PATH="/usr/local/opt/llvm/bin:$PATH"
        clang++ --version

        clang++ -std=c++20 -O2 -Wall -Wextra \
          -target x86_64-apple-macos12 \
          main.cpp -o gowr_soundtool

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gowr_soundtool-macos-intel
        path: gowr_soundtool
